name: Publish Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # 允许手动触发

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 拉取完整历史，用于检查 Tag 和生成日志

      # 设定一个变量来决定是否发布，并提取当前版本号
      - name: Prepare publish info
        id: prep
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref_name }}" != "v$VERSION" ]; then
            echo "Tag ${{ github.ref_name }} does not match package version v$VERSION."
            exit 1
          fi
          echo "publish=true" >> $GITHUB_OUTPUT

      - name: Install pnpm
        if: steps.prep.outputs.publish == 'true'
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        if: steps.prep.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.prep.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Quality checks
        if: steps.prep.outputs.publish == 'true'
        run: |
          pnpm run check-types
          pnpm run lint
          pnpm run test

      - name: Prepare release notes
        if: steps.prep.outputs.publish == 'true'
        id: changelog
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "CHANGELOG.md does not contain an entry for version $VERSION."
            exit 1
          fi

          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > LATEST_CHANGELOG.md

          {
            echo 'body<<EOF'
            cat LATEST_CHANGELOG.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Compile and Package
        if: steps.prep.outputs.publish == 'true'
        run: |
          pnpm run package
          pnpm exec vsce package -o extension.vsix

      - name: Create Release
        if: steps.prep.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: extension.vsix
          tag_name: v${{ steps.prep.outputs.version }}
          name: v${{ steps.prep.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Marketplace
        if: steps.prep.outputs.publish == 'true'
        run: pnpm exec vsce publish --packagePath extension.vsix -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        if: steps.prep.outputs.publish == 'true'
        run: pnpm exec ovsx publish extension.vsix -p ${{ secrets.OVSX_PAT }}
        continue-on-error: true
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
